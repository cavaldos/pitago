name: Feature request
description: Suggest a new capability, command, or improvement for pitago.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What pitago makes hard or impossible today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds, a pi extension that does this, or another tool.
    validations:
      required: false

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Tests run only here, on release tags. The race detector is on: pirpc
      # runs its reader, pump and process-waiter goroutines concurrently with
      # the UI thread. A failure here stops the release before any binary is
      # published.
      - name: Test
        run: go test ./... -race -count=1

      # JSONL wire contract with pi. The real pi binary is not available on
      # the runner, so this builds the stdlib fake pi server (tests/fakepi) and
      # points PI_BIN at it, which makes the live-pi tests run and pins the
      # exact payload of every command sender.
      - name: Wire test
        run: bash script/test-wire.sh

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in "linux amd64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $target
            out="dist/pitago-$TAG-$1-$2"
            [[ "$1" == windows ]] && out="$out.exe"
            GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "$out" ./src
            # Unversioned alias (stable "latest" link): pitago-<os>-<arch>[.exe]
            alias="dist/pitago-$1-$2"
            [[ "$1" == windows ]] && alias="$alias.exe"
            cp "$out" "$alias"
          done
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
